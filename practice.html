  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;practice-ticker&quot;&gt;股票代码&lt;/label&gt;&lt;input id=&quot;practice-ticker&quot; data-field=&quot;meta.ticker&quot; placeholder=&quot;例如：TSLA&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;practice-date&quot;&gt;资料截止日期&lt;/label&gt;&lt;input id=&quot;practice-date&quot; type=&quot;date&quot; data-field=&quot;meta.cutoffDate&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/header&gt;

      &lt;section class=&quot;pif-section&quot; id=&quot;practice-quality-guide&quot; data-practice-section&gt;
        &lt;p class=&quot;pif-eyebrow&quot;&gt;填写前先看这一张表&lt;/p&gt;
        &lt;h2&gt;好答案能被复查，空话只能让表格看起来完整&lt;/h2&gt;
        &lt;p class=&quot;pif-question&quot;&gt;十个领域都使用同一把尺子，不在每个输入框旁重复增加说明。&lt;/p&gt;
        &lt;div class=&quot;pif-table-wrap&quot;&gt;&lt;table class=&quot;pif-table&quot;&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;字段&lt;/th&gt;&lt;th&gt;不合格&lt;/th&gt;&lt;th&gt;合格方向&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;来源&lt;/td&gt;&lt;td&gt;“网上看到的”&lt;/td&gt;&lt;td&gt;可回查的原始文件、发布日期和具体位置；二手文章只用来找线索。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;比较&lt;/td&gt;&lt;td&gt;“增长很好”&lt;/td&gt;&lt;td&gt;说明与哪个时期、原计划、同行或替代方案比较，以及为什么可比。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;证明我错&lt;/td&gt;&lt;td&gt;“情况变差时再看”&lt;/td&gt;&lt;td&gt;写出能观察到的事件、状态，或在数据可靠时写有依据的阈值。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;下一步&lt;/td&gt;&lt;td&gt;“继续关注”&lt;/td&gt;&lt;td&gt;写清查哪份原始资料中的哪个数字、状态或事件。&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;&lt;/div&gt;
        &lt;div class=&quot;pif-callout&quot;&gt;&lt;strong&gt;查不到时这样写：&lt;/strong&gt;目前无法确认。我查过……；最接近答案的资料是……，但它不能证明……；下一步查……中的……。找不到资料本身可以得到“信息不足，先核实”，不要降级到帖子或视频来凑答案。&lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;pif-section&quot; id=&quot;practice-integration&quot; data-practice-section&gt;
        &lt;div class=&quot;pif-section-head&quot;&gt;&lt;span class=&quot;pif-number&quot;&gt;01&lt;/span&gt;&lt;div&gt;&lt;h2&gt;整合管理&lt;/h2&gt;&lt;p class=&quot;pif-question&quot;&gt;这些业务在互相帮助，还是互相抢钱、抢人、拖慢进度？&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;pif-example-grid&quot;&gt;&lt;article class=&quot;pif-example&quot;&gt;&lt;h3&gt;面包店例子&lt;/h3&gt;&lt;p&gt;老店赚钱，新店装修在花钱。共用采购能省钱是帮助；两家店争同一个店长导致都管不好，就是拖累。&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;pif-example&quot;&gt;&lt;h3&gt;Tesla 例子&lt;/h3&gt;&lt;p&gt;汽车、储能、自动驾驶和机器人共用人工智能（AI）能力，只有真的让开发更快、成本更低或产品更可靠，才算帮助。&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;
        &lt;div class=&quot;pif-form-grid&quot;&gt;
          &lt;div class=&quot;pif-field pif-field-wide&quot;&gt;&lt;label for=&quot;integration-answer&quot;&gt;先用一句话回答 &lt;span class=&quot;pif-hint&quot;&gt;哪些现在赚钱，哪些还在花钱？&lt;/span&gt;&lt;/label&gt;&lt;textarea id=&quot;integration-answer&quot; data-field=&quot;domains.integration.answer&quot; placeholder=&quot;不知道也可以写：目前只知道……还不知道……&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;integration-source&quot;&gt;事实来自哪里&lt;/label&gt;&lt;input id=&quot;integration-source&quot; data-field=&quot;domains.integration.source&quot; placeholder=&quot;财报页码、公告链接或访谈日期&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;integration-compare&quot;&gt;跟什么比较&lt;/label&gt;&lt;input id=&quot;integration-compare&quot; data-field=&quot;domains.integration.comparison&quot; placeholder=&quot;去年、原计划、同行或另一种资金用途&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;integration-wrong&quot;&gt;什么会证明我错了&lt;/label&gt;&lt;textarea id=&quot;integration-wrong&quot; data-field=&quot;domains.integration.disproof&quot; placeholder=&quot;例如：共用团队后两个项目都持续延期&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;integration-next&quot;&gt;下一步只查什么&lt;/label&gt;&lt;textarea id=&quot;integration-next&quot; data-field=&quot;domains.integration.next&quot; placeholder=&quot;一份资料、一个数字或一个具体事实&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;p class=&quot;pif-self-check&quot;&gt;&lt;strong&gt;检查自己：&lt;/strong&gt;我是否把“业务听起来有关”误当成真实帮助？我能否说出省了多少钱、快了多久或可靠性怎样变化？若几个项目同时缺钱，我知道公司先保谁吗？&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;pif-section&quot; id=&quot;practice-scope&quot; data-practice-section&gt;
        &lt;div class=&quot;pif-section-head&quot;&gt;&lt;span class=&quot;pif-number&quot;&gt;02&lt;/span&gt;&lt;div&gt;&lt;h2&gt;范围管理&lt;/h2&gt;&lt;p class=&quot;pif-question&quot;&gt;公司怎样判断需求的重要程度和紧急程度，又为优先需求承诺了什么范围？&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;pif-example-grid&quot;&gt;&lt;article class=&quot;pif-example&quot;&gt;&lt;h3&gt;面包店例子&lt;/h3&gt;&lt;p&gt;午餐顾客马上需要更快出餐，既重要又紧急；节日礼盒可能重要但不紧急。确定先后后，还要写清这次是缩短等候、增加座位，还是开新店。&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;pif-example&quot;&gt;&lt;h3&gt;Tesla 例子&lt;/h3&gt;&lt;p&gt;汽车、储能、Robotaxi 和机器人面对的需求不能按故事大小自动排序。要看不解决的后果、客户能等多久、是否已有预算，以及公司实际把资源投给谁。&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;
        &lt;div class=&quot;pif-form-grid&quot;&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;scope-priority&quot;&gt;需求优先级&lt;/label&gt;&lt;select id=&quot;scope-priority&quot; data-field=&quot;domains.scope.priority&quot;&gt;&lt;option value=&quot;&quot;&gt;请选择&lt;/option&gt;&lt;option&gt;重要且紧急&lt;/option&gt;&lt;option&gt;重要但不紧急&lt;/option&gt;&lt;option&gt;紧急但不重要&lt;/option&gt;&lt;option&gt;不重要也不紧急&lt;/option&gt;&lt;option&gt;目前无法判断&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;scope-priority-evidence&quot;&gt;为什么这样判断&lt;/label&gt;&lt;textarea id=&quot;scope-priority-evidence&quot; data-field=&quot;domains.scope.priorityEvidence&quot; placeholder=&quot;写清需求属于谁、不解决的后果、客户能等多久，以及预算、订单或期限证据&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field pif-field-wide&quot;&gt;&lt;label for=&quot;scope-answer&quot;&gt;公司承诺的范围 &lt;span class=&quot;pif-hint&quot;&gt;已做到、没做到、验收标准、明确不包括什么&lt;/span&gt;&lt;/label&gt;&lt;textarea id=&quot;scope-answer&quot; data-field=&quot;domains.scope.answer&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;scope-source&quot;&gt;事实来自哪里&lt;/label&gt;&lt;input id=&quot;scope-source&quot; data-field=&quot;domains.scope.source&quot; placeholder=&quot;优先写原始资料&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;scope-compare&quot;&gt;公司拿什么作比较&lt;/label&gt;&lt;input id=&quot;scope-compare&quot; data-field=&quot;domains.scope.comparison&quot; placeholder=&quot;旧需求排序、客户行动、公司原范围、同行产品&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;scope-wrong&quot;&gt;什么事实说明公司的优先级或范围判断有误&lt;/label&gt;&lt;textarea id=&quot;scope-wrong&quot; data-field=&quot;domains.scope.disproof&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;scope-next&quot;&gt;下一步查哪项公司事实&lt;/label&gt;&lt;textarea id=&quot;scope-next&quot; data-field=&quot;domains.scope.next&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;p class=&quot;pif-self-check&quot;&gt;&lt;strong&gt;检查公司：&lt;/strong&gt;公司是否把“市场很热”当成需求紧急，把“未来空间很大”当成需求重要？最高优先级需求是否真的获得资金和人员？公司有没有把“计划做”写成“已经做到”？&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;pif-section&quot; id=&quot;practice-schedule&quot; data-practice-section&gt;
        &lt;div class=&quot;pif-section-head&quot;&gt;&lt;span class=&quot;pif-number&quot;&gt;03&lt;/span&gt;&lt;div&gt;&lt;h2&gt;进度管理&lt;/h2&gt;&lt;p class=&quot;pif-question&quot;&gt;公司的里程碑和检查节点是什么，实际进度与进度基准偏差多少？&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;pif-example-grid&quot;&gt;&lt;article class=&quot;pif-example&quot;&gt;&lt;h3&gt;面包店例子&lt;/h3&gt;&lt;p&gt;取得许可和正式开门是里程碑；每周工程会和政府验收是检查节点。装修做了很多工作，不代表许可证这个关键里程碑已经完成。&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;pif-example&quot;&gt;&lt;h3&gt;Tesla 例子&lt;/h3&gt;&lt;p&gt;安全验证、正式许可、付费接客和更多地区复制可以分别作为 Robotaxi 里程碑；财报和监管公示是用来验收进度的检查节点。&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;
        &lt;div class=&quot;pif-form-grid&quot;&gt;
          &lt;div class=&quot;pif-field pif-field-wide&quot;&gt;&lt;label for=&quot;schedule-answer&quot;&gt;关键里程碑与验收标准 &lt;span class=&quot;pif-hint&quot;&gt;必须出现什么结果，谁根据什么确认完成&lt;/span&gt;&lt;/label&gt;&lt;textarea id=&quot;schedule-answer&quot; data-field=&quot;domains.schedule.answer&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;schedule-source&quot;&gt;事实来自哪里&lt;/label&gt;&lt;input id=&quot;schedule-source&quot; data-field=&quot;domains.schedule.source&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;schedule-compare&quot;&gt;进度基准与当前预计&lt;/label&gt;&lt;input id=&quot;schedule-compare&quot; data-field=&quot;domains.schedule.comparison&quot; placeholder=&quot;公司原定日期、实际结果、当前预计日期&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;schedule-wrong&quot;&gt;进度偏差及公司纠偏&lt;/label&gt;&lt;textarea id=&quot;schedule-wrong&quot; data-field=&quot;domains.schedule.disproof&quot; placeholder=&quot;偏差在哪里、是否影响关键路径，公司怎样调整资源、范围或计划&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;schedule-next&quot;&gt;下一个检查节点与要验收的证据&lt;/label&gt;&lt;textarea id=&quot;schedule-next&quot; data-field=&quot;domains.schedule.next&quot; placeholder=&quot;内部检查、财报、监管审查等；届时要公开什么事实&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;p class=&quot;pif-self-check&quot;&gt;&lt;strong&gt;检查公司：&lt;/strong&gt;公司写的是活动还是可验收的里程碑？检查节点是否真的验收了关键结果？日期后移发生在关键路径上吗？公司是否更新了进度基准、资源和后续计划？&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;pif-section&quot; id=&quot;practice-cost&quot; data-practice-section&gt;
        &lt;div class=&quot;pif-section-head&quot;&gt;&lt;span class=&quot;pif-number&quot;&gt;04&lt;/span&gt;&lt;div&gt;&lt;h2&gt;成本管理&lt;/h2&gt;&lt;p class=&quot;pif-question&quot;&gt;做成还要花多少，公司的钱够不够，旧股东会不会被迫分薄？&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;pif-example-grid&quot;&gt;&lt;article class=&quot;pif-example&quot;&gt;&lt;h3&gt;面包店例子&lt;/h3&gt;&lt;p&gt;装修预算只算了设备，却漏了租金、培训、损耗和开业后的亏损，就会在真正赚钱前先没钱。&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;pif-example&quot;&gt;&lt;h3&gt;Tesla 例子&lt;/h3&gt;&lt;p&gt;训练算力、芯片、车辆、保险、充电、清洁和远程协助都要花钱，不能只看一辆车的制造成本。&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;
        &lt;div class=&quot;pif-form-grid&quot;&gt;
          &lt;div class=&quot;pif-field pif-field-wide&quot;&gt;&lt;label for=&quot;cost-answer&quot;&gt;先用一句话回答 &lt;span class=&quot;pif-hint&quot;&gt;现金、负债、正在投入和大约还要花多少&lt;/span&gt;&lt;/label&gt;&lt;textarea id=&quot;cost-answer&quot; data-field=&quot;domains.cost.answer&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;cost-source&quot;&gt;事实来自哪里&lt;/label&gt;&lt;input id=&quot;cost-source&quot; data-field=&quot;domains.cost.source&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;cost-compare&quot;&gt;跟什么比较&lt;/label&gt;&lt;input id=&quot;cost-compare&quot; data-field=&quot;domains.cost.comparison&quot; placeholder=&quot;预算、上期、同行或每单位成本&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;cost-wrong&quot;&gt;什么会证明我错了&lt;/label&gt;&lt;textarea id=&quot;cost-wrong&quot; data-field=&quot;domains.cost.disproof&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;cost-next&quot;&gt;下一步只查什么&lt;/label&gt;&lt;textarea id=&quot;cost-next&quot; data-field=&quot;domains.cost.next&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;p class=&quot;pif-self-check&quot;&gt;&lt;strong&gt;检查自己：&lt;/strong&gt;账上现金是否已有明确用途？项目扩大后每多卖一件是多赚还是多亏？如果需要增发股票，每个旧股东所占比例会变小多少？&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;pif-section&quot; id=&quot;practice-quality&quot; data-practice-section&gt;
        &lt;div class=&quot;pif-section-head&quot;&gt;&lt;span class=&quot;pif-number&quot;&gt;05&lt;/span&gt;&lt;div&gt;&lt;h2&gt;质量管理&lt;/h2&gt;&lt;p class=&quot;pif-question&quot;&gt;产品是真的稳定好用，还是只在精心准备的演示里好看？&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;pif-example-grid&quot;&gt;&lt;article class=&quot;pif-example&quot;&gt;&lt;h3&gt;面包店例子&lt;/h3&gt;&lt;p&gt;开业当天的面包好吃不够；高峰期连续三个月仍能按时出炉、少退货、顾客复购，才接近稳定质量。&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;pif-example&quot;&gt;&lt;h3&gt;Tesla 例子&lt;/h3&gt;&lt;p&gt;一次无人干预的视频不能说明 Robotaxi 可运营，要看真实道路、坏天气、事故和人工帮忙次数。&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;
        &lt;div class=&quot;pif-form-grid&quot;&gt;
          &lt;div class=&quot;pif-field pif-field-wide&quot;&gt;&lt;label for=&quot;quality-answer&quot;&gt;先用一句话回答 &lt;span class=&quot;pif-hint&quot;&gt;使用场景、成功率和主要失败情况&lt;/span&gt;&lt;/label&gt;&lt;textarea id=&quot;quality-answer&quot; data-field=&quot;domains.quality.answer&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;quality-source&quot;&gt;事实来自哪里&lt;/label&gt;&lt;input id=&quot;quality-source&quot; data-field=&quot;domains.quality.source&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;quality-compare&quot;&gt;跟什么比较&lt;/label&gt;&lt;input id=&quot;quality-compare&quot; data-field=&quot;domains.quality.comparison&quot; placeholder=&quot;旧版本、人工方案、同行、承诺标准&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;quality-wrong&quot;&gt;什么会证明我错了&lt;/label&gt;&lt;textarea id=&quot;quality-wrong&quot; data-field=&quot;domains.quality.disproof&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;quality-next&quot;&gt;下一步只查什么&lt;/label&gt;&lt;textarea id=&quot;quality-next&quot; data-field=&quot;domains.quality.next&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;p class=&quot;pif-self-check&quot;&gt;&lt;strong&gt;检查自己：&lt;/strong&gt;样本覆盖了普通和困难场景吗？公司只公布成功次数，还是也公布失败次数？质量提高是否靠更多人工或更高成本换来？&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;pif-section&quot; id=&quot;practice-resource&quot; data-practice-section&gt;
        &lt;div class=&quot;pif-section-head&quot;&gt;&lt;span class=&quot;pif-number&quot;&gt;06&lt;/span&gt;&lt;div&gt;&lt;h2&gt;资源管理&lt;/h2&gt;&lt;p class=&quot;pif-question&quot;&gt;现在真正卡住公司的是什么，补上后结果应该怎样变化？&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;pif-example-grid&quot;&gt;&lt;article class=&quot;pif-example&quot;&gt;&lt;h3&gt;面包店例子&lt;/h3&gt;&lt;p&gt;客人很多却只有一台烤箱，增加广告没有用；补一台烤箱后等待时间和销量应该立刻改善。&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;pif-example&quot;&gt;&lt;h3&gt;Tesla 例子&lt;/h3&gt;&lt;p&gt;限制 AI 进展的可能是算力、训练数据、芯片、工程师或监管，不同堵点需要不同证据和解决办法。&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;
        &lt;div class=&quot;pif-form-grid&quot;&gt;

      &lt;section class=&quot;pif-section&quot; id=&quot;practice-communication&quot; data-practice-section&gt;
        &lt;div class=&quot;pif-section-head&quot;&gt;&lt;span class=&quot;pif-number&quot;&gt;07&lt;/span&gt;&lt;div&gt;&lt;h2&gt;沟通管理&lt;/h2&gt;&lt;p class=&quot;pif-question&quot;&gt;谁说的，原始证据在哪里，事实、公司计划和我的推断是否分开？&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;pif-example-grid&quot;&gt;&lt;article class=&quot;pif-example&quot;&gt;&lt;h3&gt;面包店例子&lt;/h3&gt;&lt;p&gt;“顾客都很喜欢”是店长说法；复购率和退款记录是事实；“下月会盈利”仍是推断。&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;pif-example&quot;&gt;&lt;h3&gt;Tesla 例子&lt;/h3&gt;&lt;p&gt;把监管文件、财报数字、管理层目标、媒体转述和个人推断放在同一层，会让一个猜测看起来像已经证实。&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;

      &lt;section class=&quot;pif-section&quot; id=&quot;practice-risk&quot; data-practice-section&gt;
        &lt;div class=&quot;pif-section-head&quot;&gt;&lt;span class=&quot;pif-number&quot;&gt;08&lt;/span&gt;&lt;div&gt;&lt;h2&gt;风险管理&lt;/h2&gt;&lt;p class=&quot;pif-question&quot;&gt;公司怎样识别风险、做定性和定量分析、采取应对，并监督风险是否缩小？&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;pif-example-grid&quot;&gt;&lt;article class=&quot;pif-example&quot;&gt;&lt;h3&gt;面包店例子&lt;/h3&gt;&lt;p&gt;小麦可能涨价是风险；已经涨价就是问题。公司要判断概率、影响和紧急性，估计多花多少钱、持续多久，再检查锁价或更换供应商是否有效。&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;pif-example&quot;&gt;&lt;h3&gt;Tesla 假设例子&lt;/h3&gt;&lt;p&gt;如果公司原预计某项新业务明年能在支付经营和必要投入后留下现金，也就是自由现金流转正；后来因为投入增加、收入不足而推迟到 2028 年，说明风险暴露时间和累计资金需求增加，需要继续检查公司的应对是否有效。&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;
        &lt;div class=&quot;pif-form-grid&quot;&gt;
          &lt;div class=&quot;pif-field pif-field-wide&quot;&gt;&lt;label for=&quot;risk-answer&quot;&gt;风险识别 &lt;span class=&quot;pif-hint&quot;&gt;原因 → 可能事件 → 影响哪个公司目标；已经发生时写成问题&lt;/span&gt;&lt;/label&gt;&lt;textarea id=&quot;risk-answer&quot; data-field=&quot;domains.risk.answer&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;risk-qualitative&quot;&gt;定性风险分析&lt;/label&gt;&lt;textarea id=&quot;risk-qualitative&quot; data-field=&quot;domains.risk.qualitative&quot; placeholder=&quot;发生可能性、影响程度、紧急性，以及公司排序&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;risk-quantitative&quot;&gt;定量风险分析&lt;/label&gt;&lt;textarea id=&quot;risk-quantitative&quot; data-field=&quot;domains.risk.quantitative&quot; placeholder=&quot;可能损失、追加投入、延期、现金能撑多久；无可靠数字就写范围或未披露&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;risk-source&quot;&gt;事实来自哪里&lt;/label&gt;&lt;input id=&quot;risk-source&quot; data-field=&quot;domains.risk.source&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;risk-compare&quot;&gt;原估计与最新估计&lt;/label&gt;&lt;input id=&quot;risk-compare&quot; data-field=&quot;domains.risk.comparison&quot; placeholder=&quot;原概率和影响、原投入与时间；实际表现与当前预计&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;risk-wrong&quot;&gt;公司采取了什么风险应对，效果怎样&lt;/label&gt;&lt;textarea id=&quot;risk-wrong&quot; data-field=&quot;domains.risk.disproof&quot; placeholder=&quot;规避、减轻、转移或接受；负责人、资源、时间和实际改善&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;risk-next&quot;&gt;公司怎样监督风险；下一个检查节点是什么&lt;/label&gt;&lt;textarea id=&quot;risk-next&quot; data-field=&quot;domains.risk.next&quot; placeholder=&quot;要比较的经营指标、里程碑、财报或监管事实，以及剩余风险&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;p class=&quot;pif-self-check&quot;&gt;&lt;strong&gt;检查公司：&lt;/strong&gt;公司是否只说“高度重视”，却没有定性排序、定量估计、负责人和完成时间？实际投入、损失和预计解决时间是在收敛，还是变得更大、更久、更贵？&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;pif-section&quot; id=&quot;practice-procurement&quot; data-practice-section&gt;
        &lt;div class=&quot;pif-section-head&quot;&gt;&lt;span class=&quot;pif-number&quot;&gt;09&lt;/span&gt;&lt;div&gt;&lt;h2&gt;采购管理&lt;/h2&gt;&lt;p class=&quot;pif-question&quot;&gt;关键东西依赖谁，对方出问题时能不能换，换一次要多久、多少钱？&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;pif-example-grid&quot;&gt;&lt;article class=&quot;pif-example&quot;&gt;&lt;h3&gt;面包店例子&lt;/h3&gt;&lt;p&gt;独家面粉便宜但只有一家供应商。断货后找到另一家不够，新面粉还要重新试配方和通过顾客检验。&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;pif-example&quot;&gt;&lt;h3&gt;Tesla 例子&lt;/h3&gt;&lt;p&gt;芯片、电池材料、云算力和关键设备即使有替代者，也要看认证、产能、价格和切换时间。&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;

          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;procurement-next&quot;&gt;下一步只查什么&lt;/label&gt;&lt;textarea id=&quot;procurement-next&quot; data-field=&quot;domains.procurement.next&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;

        &lt;div class=&quot;pif-section-head&quot;&gt;&lt;span class=&quot;pif-number&quot;&gt;10&lt;/span&gt;&lt;div&gt;&lt;h2&gt;相关方管理&lt;/h2&gt;&lt;p class=&quot;pif-question&quot;&gt;谁能让项目成功或失败，他们为什么会配合，真实行动是什么？&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;

      &lt;section class=&quot;pif-section&quot; id=&quot;practice-summary&quot; data-practice-section&gt;
        &lt;p class=&quot;pif-eyebrow&quot;&gt;不要交一份概念作业&lt;/p&gt;
        &lt;h2&gt;汇总：我现在知道什么，下一步只做什么&lt;/h2&gt;
        &lt;p class=&quot;pif-question&quot;&gt;这部分才是练习册的交付物。十领域里的记录可以不完整，但下面每一栏都应能指导一次具体复核。&lt;/p&gt;
        &lt;div class=&quot;pif-summary-grid&quot;&gt;
          &lt;div class=&quot;pif-field pif-field-wide&quot;&gt;&lt;label for=&quot;summary-money&quot;&gt;公司怎样赚钱&lt;/label&gt;&lt;textarea id=&quot;summary-money&quot; data-field=&quot;summary.money&quot; placeholder=&quot;谁为什么付钱，公司扣掉哪些成本后留下钱&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;

          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;summary-next&quot;&gt;下一步只查什么&lt;/label&gt;&lt;textarea id=&quot;summary-next&quot; data-field=&quot;summary.next&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;summary-change&quot;&gt;什么事实出现后必须修改判断&lt;/label&gt;&lt;textarea id=&quot;summary-change&quot; data-field=&quot;summary.change&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;summary-price&quot;&gt;按现价，公司以后大概要做到什么&lt;/label&gt;&lt;textarea id=&quot;summary-price&quot; data-field=&quot;summary.price&quot; placeholder=&quot;只写大致规模、利润和时间，不假装只有唯一答案&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;

      &lt;section class=&quot;pif-section&quot; id=&quot;practice-reviews&quot; data-practice-section&gt;
        &lt;p class=&quot;pif-eyebrow&quot;&gt;不要只保存最新答案&lt;/p&gt;
        &lt;h2&gt;复查记录：哪条新事实，让我改了哪项判断？&lt;/h2&gt;
        &lt;p class=&quot;pif-question&quot;&gt;同一事实只记录一次，再写它影响了哪些领域。只有完成一次明确复查时才保存，不为每次打字制造没有意义的版本。&lt;/p&gt;
        &lt;div class=&quot;pif-form-grid pif-review-form&quot;&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;review-date&quot;&gt;复查日期&lt;/label&gt;&lt;input id=&quot;review-date&quot; type=&quot;date&quot; data-field=&quot;reviewDraft.date&quot; data-review-field=&quot;date&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;review-domains&quot;&gt;影响哪些领域 &lt;span class=&quot;pif-hint&quot;&gt;可以写多个&lt;/span&gt;&lt;/label&gt;&lt;input id=&quot;review-domains&quot; data-field=&quot;reviewDraft.domains&quot; data-review-field=&quot;domains&quot; placeholder=&quot;例如：成本、质量、进度、估值&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field pif-field-wide&quot;&gt;&lt;label for=&quot;review-fact&quot;&gt;新事实是什么&lt;/label&gt;&lt;textarea id=&quot;review-fact&quot; data-field=&quot;reviewDraft.fact&quot; data-review-field=&quot;fact&quot; placeholder=&quot;只写已经发生或可以核对的事实，不把解释混进来&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field pif-field-wide&quot;&gt;&lt;label for=&quot;review-source&quot;&gt;原始来源在哪里&lt;/label&gt;&lt;input id=&quot;review-source&quot; data-field=&quot;reviewDraft.source&quot; data-review-field=&quot;source&quot; placeholder=&quot;文件名称、发布日期和具体位置；无法验证也要写明&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;review-old&quot;&gt;原判断&lt;/label&gt;&lt;textarea id=&quot;review-old&quot; data-field=&quot;reviewDraft.oldJudgment&quot; data-review-field=&quot;oldJudgment&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;review-new&quot;&gt;新判断&lt;/label&gt;&lt;textarea id=&quot;review-new&quot; data-field=&quot;reviewDraft.newJudgment&quot; data-review-field=&quot;newJudgment&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;review-reason&quot;&gt;为什么改变&lt;/label&gt;&lt;textarea id=&quot;review-reason&quot; data-field=&quot;reviewDraft.reason&quot; data-review-field=&quot;reason&quot; placeholder=&quot;说明新事实怎样连接到收入、成本、时间或风险&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;review-next&quot;&gt;下一步&lt;/label&gt;&lt;textarea id=&quot;review-next&quot; data-field=&quot;reviewDraft.next&quot; data-review-field=&quot;next&quot; placeholder=&quot;下一份资料中的一个数字、状态或事件&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field pif-field-wide&quot;&gt;&lt;button class=&quot;pif-button pif-button-primary&quot; type=&quot;button&quot; data-add-review&gt;保存这次复查&lt;/button&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;pif-review-list&quot; data-review-list aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
      &lt;/section&gt;

      &lt;footer class=&quot;pif-footer&quot;&gt;
        &lt;p&gt;&lt;strong&gt;本地保存说明：&lt;/strong&gt;填写内容和复查记录只保存在当前浏览器，不会上传到网络。清理浏览器数据可能丢失记录，请定期使用“导出记录”保存备份文件。&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;研究边界：&lt;/strong&gt;本练习册用于练习组织事实和修改判断，不提供个股推荐、目标价或收益承诺。&lt;/p&gt;
      &lt;/footer&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (function () {
      &quot;use strict&quot;;
      var root = document.getElementById(&quot;pm-investment-practice&quot;);
      if (!root) return;

      var storageKey = &quot;pm-investment-practice:v1&quot;;
      var fields = Array.prototype.slice.call(root.querySelectorAll(&quot;[data-field]&quot;));
      var reviewFields = Array.prototype.slice.call(root.querySelectorAll(&quot;[data-review-field]&quot;));
      var status = root.querySelector(&quot;[data-status]&quot;);
      var preview = root.querySelector(&quot;[data-summary-preview]&quot;);
      var reviewList = root.querySelector(&quot;[data-review-list]&quot;);
      var reviews = [];
      var saveTimer = null;
      var storageAvailable = true;

      function setStatus(message) {
        if (status) status.textContent = message;
      }

      function valuesFromForm() {
        var values = {};
        fields.forEach(function (field) { values[field.getAttribute(&quot;data-field&quot;)] = field.value; });
        return values;
      }

      function applyValues(values) {
        if (!values || typeof values !== &quot;object&quot;) return;
        fields.forEach(function (field) {
          var key = field.getAttribute(&quot;data-field&quot;);
          if (Object.prototype.hasOwnProperty.call(values, key)) field.value = String(values[key] == null ? &quot;&quot; : values[key]);
        });
        renderSummary();
      }

      function makeRecord() {
        return { version: 2, updatedAt: new Date().toISOString(), values: valuesFromForm(), reviews: reviews };
      }

      function save() {
        renderSummary();
        if (!storageAvailable) return false;
        try {
          localStorage.setItem(storageKey, JSON.stringify(makeRecord()));
          setStatus(&quot;已自动保存在本机 · &quot; + new Date().toLocaleTimeString([], { hour: &quot;2-digit&quot;, minute: &quot;2-digit&quot; }));
          return true;
        } catch (error) {
          storageAvailable = false;
          setStatus(&quot;浏览器不允许本地保存，请用“导出记录”备份。 &quot;);
          return false;
        }
      }

      function scheduleSave() {
        if (saveTimer) window.clearTimeout(saveTimer);
        saveTimer = window.setTimeout(save, 250);
      }

      function value(key) {
        var field = root.querySelector(&#x27;[data-field=&quot;&#x27; + key + &#x27;&quot;]&#x27;);
        return field &amp;&amp; field.value.trim() ? field.value.trim() : &quot;不知道&quot;;
      }

      function renderSummary() {
        if (!preview) return;
        var lines = [
          &quot;# &quot; + value(&quot;meta.company&quot;) + &quot;（&quot; + value(&quot;meta.ticker&quot;) + &quot;）研究摘要&quot;,
          &quot;资料截止：&quot; + value(&quot;meta.cutoffDate&quot;),
          &quot;&quot;,
          &quot;公司怎样赚钱：\n&quot; + value(&quot;summary.money&quot;),
          &quot;&quot;,
          &quot;仍在花钱的项目：\n&quot; + value(&quot;summary.spending&quot;),
          &quot;&quot;,
          &quot;候选关键问题：\n&quot; + value(&quot;summary.critical&quot;),
          &quot;&quot;,
          &quot;最先研究的 P0 及原因：\n&quot; + value(&quot;summary.p0&quot;),
          &quot;&quot;,
          &quot;已经知道：\n&quot; + value(&quot;summary.known&quot;),
          &quot;&quot;,
          &quot;仍然不知道：\n&quot; + value(&quot;summary.unknown&quot;),
          &quot;&quot;,
          &quot;现价大约要求公司做到：\n&quot; + value(&quot;summary.price&quot;),
          &quot;&quot;,
          &quot;什么会迫使我修改判断：\n&quot; + value(&quot;summary.change&quot;),
          &quot;&quot;,
          &quot;下一步只查：\n&quot; + value(&quot;summary.next&quot;),
          &quot;&quot;,
          &quot;当前结论：&quot; + value(&quot;summary.action&quot;),
          &quot;下次复查：&quot; + value(&quot;summary.reviewDate&quot;)
        ];
        if (reviews.length) {
          var latest = reviews[0];
          lines.push(
            &quot;&quot;,
            &quot;最近一次复查：&quot; + latest.date,
            &quot;新事实：\n&quot; + latest.fact,
            &quot;原始来源：\n&quot; + latest.source,
            &quot;影响：&quot; + latest.domains,
            &quot;原判断：\n&quot; + latest.oldJudgment,
            &quot;新判断：\n&quot; + latest.newJudgment,
            &quot;改变原因：\n&quot; + latest.reason,
            &quot;下一步：\n&quot; + latest.next
          );
        }
        preview.textContent = lines.join(&quot;\n&quot;);
      }

      function safeName(text) {
        return (text || &quot;未命名公司&quot;).replace(/[\\/:*?\&quot;&lt;&gt;|\s]+/g, &quot;-&quot;).replace(/^-+|-+$/g, &quot;&quot;) || &quot;未命名公司&quot;;
      }

      function localDateStamp(date) {
        function twoDigits(number) { return String(number).padStart(2, &quot;0&quot;); }
        return date.getFullYear() + &quot;-&quot; + twoDigits(date.getMonth() + 1) + &quot;-&quot; + twoDigits(date.getDate());
      }

      function reviewValue(key) {
        var field = root.querySelector(&#x27;[data-review-field=&quot;&#x27; + key + &#x27;&quot;]&#x27;);
        return field ? field.value.trim() : &quot;&quot;;
      }

      function normaliseReviews(input) {
        if (!Array.isArray(input)) return [];
        return input.filter(function (entry) {
          return entry &amp;&amp; typeof entry === &quot;object&quot; &amp;&amp; String(entry.fact || &quot;&quot;).trim();
        }).map(function (entry, index) {
          return {
            id: String(entry.id || (&quot;imported-&quot; + index + &quot;-&quot; + String(entry.date || &quot;unknown&quot;))),
            date: String(entry.date || &quot;日期不明&quot;),
            fact: String(entry.fact || &quot;&quot;),
            source: String(entry.source || &quot;未记录&quot;),
            domains: String(entry.domains || &quot;未记录&quot;),
            oldJudgment: String(entry.oldJudgment || &quot;未记录&quot;),
            newJudgment: String(entry.newJudgment || &quot;未记录&quot;),
            reason: String(entry.reason || &quot;未记录&quot;),
            next: String(entry.next || &quot;未记录&quot;)
          };
        });
      }

      function clearReviewDraft() {
        reviewFields.forEach(function (field) { field.value = &quot;&quot;; });
        var dateField = root.querySelector(&#x27;[data-review-field=&quot;date&quot;]&#x27;);
        if (dateField) dateField.value = localDateStamp(new Date());
      }

      function addReviewItem(container, label, content, wide) {
        var item = document.createElement(&quot;div&quot;);
        item.className = &quot;pif-review-item&quot; + (wide ? &quot; pif-review-item-wide&quot; : &quot;&quot;);
        var heading = document.createElement(&quot;strong&quot;);
        heading.textContent = label;
        var text = document.createElement(&quot;span&quot;);
        text.textContent = content;
        item.appendChild(heading);
        item.appendChild(text);
        container.appendChild(item);
      }

      function renderReviewList() {
        if (!reviewList) return;
        reviewList.textContent = &quot;&quot;;
        if (!reviews.length) {
          var empty = document.createElement(&quot;div&quot;);
          empty.className = &quot;pif-review-empty&quot;;
          empty.textContent = &quot;还没有复查记录。新事实真正改变判断后，再保存第一条。&quot;;
          reviewList.appendChild(empty);
          return;
        }
        reviews.forEach(function (entry) {
          var card = document.createElement(&quot;article&quot;);
          card.className = &quot;pif-review-card&quot;;
          var head = document.createElement(&quot;div&quot;);
          head.className = &quot;pif-review-head&quot;;
          var titleWrap = document.createElement(&quot;div&quot;);
          var title = document.createElement(&quot;h3&quot;);
          title.textContent = &quot;复查 · &quot; + entry.date;
          var meta = document.createElement(&quot;p&quot;);
          meta.textContent = &quot;影响：&quot; + entry.domains;
          titleWrap.appendChild(title);
          titleWrap.appendChild(meta);
          var remove = document.createElement(&quot;button&quot;);
          remove.type = &quot;button&quot;;
          remove.className = &quot;pif-button pif-button-compact&quot;;
          remove.setAttribute(&quot;data-review-remove&quot;, entry.id);
          remove.textContent = &quot;删除这条&quot;;
          head.appendChild(titleWrap);
          head.appendChild(remove);
          card.appendChild(head);
          var grid = document.createElement(&quot;div&quot;);
          grid.className = &quot;pif-review-grid&quot;;
          addReviewItem(grid, &quot;新事实&quot;, entry.fact, true);
          addReviewItem(grid, &quot;原始来源&quot;, entry.source, true);
          addReviewItem(grid, &quot;原判断&quot;, entry.oldJudgment, false);
          addReviewItem(grid, &quot;新判断&quot;, entry.newJudgment, false);
          addReviewItem(grid, &quot;为什么改变&quot;, entry.reason, false);
          addReviewItem(grid, &quot;下一步&quot;, entry.next, false);
          card.appendChild(grid);
          reviewList.appendChild(card);
        });
      }

      function addReview() {
        var draft = {
          id: new Date().toISOString() + &quot;-&quot; + Math.random().toString(36).slice(2, 8),
          date: reviewValue(&quot;date&quot;) || localDateStamp(new Date()),
          fact: reviewValue(&quot;fact&quot;),
          source: reviewValue(&quot;source&quot;),
          domains: reviewValue(&quot;domains&quot;),
          oldJudgment: reviewValue(&quot;oldJudgment&quot;),
          newJudgment: reviewValue(&quot;newJudgment&quot;),
          reason: reviewValue(&quot;reason&quot;),
          next: reviewValue(&quot;next&quot;)
        };
        var required = [
          [&quot;fact&quot;, &quot;新事实&quot;], [&quot;source&quot;, &quot;原始来源&quot;], [&quot;domains&quot;, &quot;受影响领域&quot;],
          [&quot;oldJudgment&quot;, &quot;原判断&quot;], [&quot;newJudgment&quot;, &quot;新判断&quot;], [&quot;reason&quot;, &quot;改变原因&quot;], [&quot;next&quot;, &quot;下一步&quot;]
        ];
        for (var index = 0; index &lt; required.length; index += 1) {
          var item = required[index];
          if (!draft[item[0]]) {
            var missing = root.querySelector(&#x27;[data-review-field=&quot;&#x27; + item[0] + &#x27;&quot;]&#x27;);
            if (missing) missing.focus();
            setStatus(&quot;复查记录还缺：“&quot; + item[1] + &quot;”。不知道时也要写明为什么无法确认。 &quot;);
            return;
          }
        }
        reviews.unshift(draft);
        clearReviewDraft();
        renderReviewList();
        if (save()) setStatus(&quot;这次复查已保存；旧判断仍保留在记录中。 &quot;);
        else setStatus(&quot;复查已加入当前页面，但浏览器不允许本地保存；请立即导出记录。 &quot;);
      }

      function exportRecord() {
        var record = makeRecord();
        var blob = new Blob([JSON.stringify(record, null, 2)], { type: &quot;application/json;charset=utf-8&quot; });
        var url = URL.createObjectURL(blob);
        var link = document.createElement(&quot;a&quot;);
        link.href = url;
        link.download = safeName(value(&quot;meta.company&quot;)) + &quot;-投资研究-&quot; + localDateStamp(new Date()) + &quot;.json&quot;;
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(function () { URL.revokeObjectURL(url); }, 0);
        setStatus(&quot;记录已导出为数据备份文件。 &quot;);
      }

      function importRecord(file) {
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var record = JSON.parse(String(reader.result));
            if (!record || (record.version !== 1 &amp;&amp; record.version !== 2) || !record.values || typeof record.values !== &quot;object&quot;) throw new Error(&quot;格式不受支持&quot;);
            reviews = normaliseReviews(record.reviews);
            applyValues(record.values);
            renderReviewList();
            if (save()) setStatus(&quot;记录已导入并保存在本机。 &quot;);
            else setStatus(&quot;记录已导入当前页面，但浏览器不允许本地保存；请重新导出备份。 &quot;);
          } catch (error) {
            setStatus(&quot;导入失败：请选择由本练习册导出的数据备份文件。 &quot;);
          }
        };
        reader.onerror = function () { setStatus(&quot;文件读取失败，请重试。 &quot;); };
        reader.readAsText(file, &quot;utf-8&quot;);
      }

      function copySummary() {
        var text = preview ? preview.textContent : &quot;&quot;;
        if (navigator.clipboard &amp;&amp; navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { setStatus(&quot;研究摘要已复制。 &quot;); }, fallbackCopy);
        } else {
          fallbackCopy();
        }
        function fallbackCopy() {
          var area = document.createElement(&quot;textarea&quot;);
          area.value = text;
          area.setAttribute(&quot;readonly&quot;, &quot;&quot;);
          area.style.position = &quot;fixed&quot;;
          area.style.opacity = &quot;0&quot;;
          document.body.appendChild(area);
          area.select();
          try { document.execCommand(&quot;copy&quot;); setStatus(&quot;研究摘要已复制。 &quot;); }
          catch (error) { setStatus(&quot;无法自动复制，请手动选择摘要。 &quot;); }
          area.remove();
        }
      }

      try {
        var raw = localStorage.getItem(storageKey);
        if (raw) {
          var stored = JSON.parse(raw);
          if (!stored || (stored.version !== 1 &amp;&amp; stored.version !== 2) || !stored.values || typeof stored.values !== &quot;object&quot;) throw new Error(&quot;格式不受支持&quot;);
          reviews = normaliseReviews(stored.reviews);
          applyValues(stored.values);
          setStatus(&quot;已读取本机上次记录。 &quot;);
        } else {
          renderSummary();
          setStatus(&quot;尚无本机记录；开始输入后会自动保存。 &quot;);
        }
      } catch (error) {
        storageAvailable = false;
        renderSummary();
        setStatus(&quot;浏览器不允许读取本地记录，请用导入 / 导出备份。 &quot;);
      }

      var initialReviewDate = root.querySelector(&#x27;[data-review-field=&quot;date&quot;]&#x27;);
      if (initialReviewDate &amp;&amp; !initialReviewDate.value) initialReviewDate.value = localDateStamp(new Date());
      renderReviewList();
      renderSummary();

      fields.forEach(function (field) {
        field.addEventListener(&quot;input&quot;, scheduleSave);
        field.addEventListener(&quot;change&quot;, scheduleSave);
      });
      Array.prototype.slice.call(root.querySelectorAll(&quot;[data-print]&quot;)).forEach(function (button) { button.addEventListener(&quot;click&quot;, function () { window.print(); }); });
      var exportButton = root.querySelector(&quot;[data-export]&quot;);
      if (exportButton) exportButton.addEventListener(&quot;click&quot;, exportRecord);
      var importButton = root.querySelector(&quot;[data-import-button]&quot;);
      var importFile = root.querySelector(&quot;[data-import-file]&quot;);
      if (importButton &amp;&amp; importFile) importButton.addEventListener(&quot;click&quot;, function () { importFile.click(); });
      if (importFile) importFile.addEventListener(&quot;change&quot;, function () { importRecord(importFile.files &amp;&amp; importFile.files[0]); importFile.value = &quot;&quot;; });
      var copyButton = root.querySelector(&quot;[data-copy-summary]&quot;);
      if (copyButton) copyButton.addEventListener(&quot;click&quot;, copySummary);
      var addReviewButton = root.querySelector(&quot;[data-add-review]&quot;);
      if (addReviewButton) addReviewButton.addEventListener(&quot;click&quot;, addReview);
      if (reviewList) reviewList.addEventListener(&quot;click&quot;, function (event) {
        var button = event.target.closest &amp;&amp; event.target.closest(&quot;[data-review-remove]&quot;);
        if (!button) return;
        var reviewId = button.getAttribute(&quot;data-review-remove&quot;);
        if (!window.confirm(&quot;确定删除这条复查记录吗？删除后只能从之前导出的备份恢复。&quot;)) return;
        reviews = reviews.filter(function (entry) { return entry.id !== reviewId; });
        renderReviewList();
        if (save()) setStatus(&quot;这条复查记录已删除。 &quot;);
        else setStatus(&quot;记录已从当前页面删除，但浏览器没有保存变化；请重新导出备份。 &quot;);
      });
      var resetButton = root.querySelector(&quot;[data-reset]&quot;);
      if (resetButton) resetButton.addEventListener(&quot;click&quot;, function () {
        if (!window.confirm(&quot;确定清空这台浏览器里的全部练习记录吗？请先导出需要保留的内容。&quot;)) return;
        fields.forEach(function (field) { field.value = &quot;&quot;; });
        reviews = [];
        clearReviewDraft();
        try { localStorage.removeItem(storageKey); storageAvailable = true; }
        catch (error) { storageAvailable = false; }
        renderReviewList();
        renderSummary();
        setStatus(storageAvailable ? &quot;本机练习记录已清空。 &quot; : &quot;页面已清空，但浏览器不允许修改本地记录。 &quot;);
      });

      var links = Array.prototype.slice.call(root.querySelectorAll(&quot;a[href^=&#x27;#&#x27;]&quot;));
      links.forEach(function (link) {
        link.addEventListener(&quot;click&quot;, function (event) {
          var target = root.querySelector(link.getAttribute(&quot;href&quot;));
          if (!target) return;
          event.preventDefault();
          var reduced = window.matchMedia &amp;&amp; window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches;
          target.scrollIntoView({ behavior: reduced ? &quot;auto&quot; : &quot;smooth&quot;, block: &quot;start&quot; });
        });
      });
      var navLinks = Array.prototype.slice.call(root.querySelectorAll(&quot;[data-nav]&quot;));
      if (navLinks.length &amp;&amp; &quot;IntersectionObserver&quot; in window) {
        var map = {};
        navLinks.forEach(function (link) { map[link.getAttribute(&quot;href&quot;).slice(1)] = link; });
        var observer = new IntersectionObserver(function (entries) {
          var visible = entries.filter(function (entry) { return entry.isIntersecting; });
          if (!visible.length) return;
          visible.sort(function (a, b) { return Math.abs(a.boundingClientRect.top) - Math.abs(b.boundingClientRect.top); });
          navLinks.forEach(function (link) { link.removeAttribute(&quot;aria-current&quot;); });
          var active = map[visible[0].target.id];
          if (active) active.setAttribute(&quot;aria-current&quot;, &quot;location&quot;);
        }, { rootMargin: &quot;-8% 0px -76% 0px&quot;, threshold: [0, .01] });
        Array.prototype.slice.call(root.querySelectorAll(&quot;[data-practice-section]&quot;)).forEach(function (section) { observer.observe(section); });

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);

    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };

    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
