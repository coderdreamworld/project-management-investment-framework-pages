.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

      &lt;section class=&quot;pif-section&quot; id=&quot;practice-risk&quot; data-practice-section&gt;
        &lt;div class=&quot;pif-section-head&quot;&gt;&lt;span class=&quot;pif-number&quot;&gt;08&lt;/span&gt;&lt;div&gt;&lt;h2&gt;风险管理&lt;/h2&gt;&lt;p class=&quot;pif-question&quot;&gt;最坏的事情怎样一步步发生，公司扛得住吗，我现在盯什么？&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;pif-example-grid&quot;&gt;&lt;article class=&quot;pif-example&quot;&gt;&lt;h3&gt;面包店例子&lt;/h3&gt;&lt;p&gt;食品事故 → 停业调查 → 顾客流失 → 现金不够交租。保险和备用现金能减轻损失，但不能让事故消失。&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;pif-example&quot;&gt;&lt;h3&gt;Tesla 例子&lt;/h3&gt;&lt;p&gt;严重事故 → 服务暂停 → 更多城市收紧许可 → 收入推迟 → 继续烧钱。事故率、人工接管和许可范围是可观察信号。&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;
        &lt;div class=&quot;pif-form-grid&quot;&gt;
          &lt;div class=&quot;pif-field pif-field-wide&quot;&gt;&lt;label for=&quot;risk-answer&quot;&gt;先用一句话写完整坏事链 &lt;span class=&quot;pif-hint&quot;&gt;现在经不起什么 → 什么引爆 → 怎样传下去 → 什么能缓冲&lt;/span&gt;&lt;/label&gt;&lt;textarea id=&quot;risk-answer&quot; data-field=&quot;domains.risk.answer&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;risk-source&quot;&gt;事实来自哪里&lt;/label&gt;&lt;input id=&quot;risk-source&quot; data-field=&quot;domains.risk.source&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;risk-compare&quot;&gt;跟什么比较&lt;/label&gt;&lt;input id=&quot;risk-compare&quot; data-field=&quot;domains.risk.comparison&quot; placeholder=&quot;历史事故、同行、压力情景&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;risk-wrong&quot;&gt;什么说明风险正在变小&lt;/label&gt;&lt;textarea id=&quot;risk-wrong&quot; data-field=&quot;domains.risk.disproof&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;div class=&quot;pif-field&quot;&gt;&lt;label for=&quot;risk-next&quot;&gt;下一步盯什么；发生后改什么&lt;/label&gt;&lt;textarea id=&quot;risk-next&quot; data-field=&quot;domains.risk.next&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
        &lt;/div&gt;

        &lt;pre class=&quot;pif-summary-preview&quot; data-summary-preview&gt;开始填写后，这里会自动生成一份可复制的摘要。&lt;/pre&gt;
        &lt;div class=&quot;pif-summary-actions&quot;&gt;&lt;button class=&quot;pif-button pif-button-primary&quot; type=&quot;button&quot; data-copy-summary&gt;复制摘要&lt;/button&gt;&lt;button class=&quot;pif-button&quot; type=&quot;button&quot; data-print&gt;打印 / 保存为电子文档（PDF）&lt;/button&gt;&lt;/div&gt;

        &lt;p&gt;&lt;strong&gt;本地保存说明：&lt;/strong&gt;自动保存只发生在当前浏览器的本地存储中，不会上传到网络。清理浏览器数据可能丢失记录，请定期使用“导出记录”保存备份文件。&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;研究边界：&lt;/strong&gt;本练习册用于练习组织事实和修改判断，不提供个股推荐、目标价或收益承诺。&lt;/p&gt;

  &lt;script&gt;
    (function () {
      &quot;use strict&quot;;
      var root = document.getElementById(&quot;pm-investment-practice&quot;);
      if (!root) return;

      var storageKey = &quot;pm-investment-practice:v1&quot;;
      var fields = Array.prototype.slice.call(root.querySelectorAll(&quot;[data-field]&quot;));
      var status = root.querySelector(&quot;[data-status]&quot;);
      var preview = root.querySelector(&quot;[data-summary-preview]&quot;);
      var saveTimer = null;
      var storageAvailable = true;

      function setStatus(message) {
        if (status) status.textContent = message;
      }

      function valuesFromForm() {
        var values = {};
        fields.forEach(function (field) { values[field.getAttribute(&quot;data-field&quot;)] = field.value; });
        return values;
      }

      function applyValues(values) {
        if (!values || typeof values !== &quot;object&quot;) return;
        fields.forEach(function (field) {
          var key = field.getAttribute(&quot;data-field&quot;);
          if (Object.prototype.hasOwnProperty.call(values, key)) field.value = String(values[key] == null ? &quot;&quot; : values[key]);
        });
        renderSummary();
      }

      function makeRecord() {
        return { version: 1, updatedAt: new Date().toISOString(), values: valuesFromForm() };
      }

      function save() {
        renderSummary();
        if (!storageAvailable) return;
        try {
          localStorage.setItem(storageKey, JSON.stringify(makeRecord()));
          setStatus(&quot;已自动保存在本机 · &quot; + new Date().toLocaleTimeString([], { hour: &quot;2-digit&quot;, minute: &quot;2-digit&quot; }));
        } catch (error) {
          storageAvailable = false;
          setStatus(&quot;浏览器不允许本地保存，请用“导出记录”备份。 &quot;);
        }
      }

      function scheduleSave() {
        if (saveTimer) window.clearTimeout(saveTimer);
        saveTimer = window.setTimeout(save, 250);
      }

      function value(key) {
        var field = root.querySelector(&#x27;[data-field=&quot;&#x27; + key + &#x27;&quot;]&#x27;);
        return field &amp;&amp; field.value.trim() ? field.value.trim() : &quot;不知道&quot;;
      }

      function renderSummary() {
        if (!preview) return;
        var lines = [
          &quot;# &quot; + value(&quot;meta.company&quot;) + &quot;（&quot; + value(&quot;meta.ticker&quot;) + &quot;）研究摘要&quot;,
          &quot;资料截止：&quot; + value(&quot;meta.cutoffDate&quot;),
          &quot;&quot;,
          &quot;公司怎样赚钱：\n&quot; + value(&quot;summary.money&quot;),
          &quot;&quot;,
          &quot;仍在花钱的项目：\n&quot; + value(&quot;summary.spending&quot;),
          &quot;&quot;,
          &quot;最不能判断错的三件事：\n&quot; + value(&quot;summary.critical&quot;),
          &quot;&quot;,
          &quot;已经知道：\n&quot; + value(&quot;summary.known&quot;),
          &quot;&quot;,
          &quot;仍然不知道：\n&quot; + value(&quot;summary.unknown&quot;),
          &quot;&quot;,
          &quot;现价大约要求公司做到：\n&quot; + value(&quot;summary.price&quot;),
          &quot;&quot;,
          &quot;什么会迫使我修改判断：\n&quot; + value(&quot;summary.change&quot;),
          &quot;&quot;,
          &quot;下一步只查：\n&quot; + value(&quot;summary.next&quot;),
          &quot;&quot;,
          &quot;当前结论：&quot; + value(&quot;summary.action&quot;),
          &quot;下次复查：&quot; + value(&quot;summary.reviewDate&quot;)
        ];
        preview.textContent = lines.join(&quot;\n&quot;);
      }

      function safeName(text) {
        return (text || &quot;未命名公司&quot;).replace(/[\\/:*?\&quot;&lt;&gt;|\s]+/g, &quot;-&quot;).replace(/^-+|-+$/g, &quot;&quot;) || &quot;未命名公司&quot;;
      }

      function localDateStamp(date) {
        function twoDigits(number) { return String(number).padStart(2, &quot;0&quot;); }
        return date.getFullYear() + &quot;-&quot; + twoDigits(date.getMonth() + 1) + &quot;-&quot; + twoDigits(date.getDate());
      }

      function exportRecord() {
        var record = makeRecord();
        var blob = new Blob([JSON.stringify(record, null, 2)], { type: &quot;application/json;charset=utf-8&quot; });
        var url = URL.createObjectURL(blob);
        var link = document.createElement(&quot;a&quot;);
        link.href = url;
        link.download = safeName(value(&quot;meta.company&quot;)) + &quot;-投资研究-&quot; + localDateStamp(new Date()) + &quot;.json&quot;;
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(function () { URL.revokeObjectURL(url); }, 0);
        setStatus(&quot;记录已导出为数据备份文件。 &quot;);
      }

      function importRecord(file) {
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var record = JSON.parse(String(reader.result));
            if (!record || record.version !== 1 || !record.values || typeof record.values !== &quot;object&quot;) throw new Error(&quot;格式不受支持&quot;);
            applyValues(record.values);
            save();
            setStatus(&quot;记录已导入并保存在本机。 &quot;);
          } catch (error) {
            setStatus(&quot;导入失败：请选择由本练习册导出的数据备份文件。 &quot;);
          }
        };
        reader.onerror = function () { setStatus(&quot;文件读取失败，请重试。 &quot;); };
        reader.readAsText(file, &quot;utf-8&quot;);
      }

      function copySummary() {
        var text = preview ? preview.textContent : &quot;&quot;;
        if (navigator.clipboard &amp;&amp; navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { setStatus(&quot;研究摘要已复制。 &quot;); }, fallbackCopy);
        } else {
          fallbackCopy();
        }
        function fallbackCopy() {
          var area = document.createElement(&quot;textarea&quot;);
          area.value = text;
          area.setAttribute(&quot;readonly&quot;, &quot;&quot;);
          area.style.position = &quot;fixed&quot;;
          area.style.opacity = &quot;0&quot;;
          document.body.appendChild(area);
          area.select();
          try { document.execCommand(&quot;copy&quot;); setStatus(&quot;研究摘要已复制。 &quot;); }
          catch (error) { setStatus(&quot;无法自动复制，请手动选择摘要。 &quot;); }
          area.remove();
        }
      }

      try {
        var raw = localStorage.getItem(storageKey);
        if (raw) {
          var stored = JSON.parse(raw);
          if (stored &amp;&amp; stored.version === 1) applyValues(stored.values);
          setStatus(&quot;已读取本机上次记录。 &quot;);
        } else {
          renderSummary();
          setStatus(&quot;尚无本机记录；开始输入后会自动保存。 &quot;);
        }
      } catch (error) {
        storageAvailable = false;
        renderSummary();
        setStatus(&quot;浏览器不允许读取本地记录，请用导入 / 导出备份。 &quot;);
      }

      fields.forEach(function (field) {
        field.addEventListener(&quot;input&quot;, scheduleSave);
        field.addEventListener(&quot;change&quot;, scheduleSave);
      });
      Array.prototype.slice.call(root.querySelectorAll(&quot;[data-print]&quot;)).forEach(function (button) { button.addEventListener(&quot;click&quot;, function () { window.print(); }); });
      var exportButton = root.querySelector(&quot;[data-export]&quot;);
      if (exportButton) exportButton.addEventListener(&quot;click&quot;, exportRecord);
      var importButton = root.querySelector(&quot;[data-import-button]&quot;);
      var importFile = root.querySelector(&quot;[data-import-file]&quot;);
      if (importButton &amp;&amp; importFile) importButton.addEventListener(&quot;click&quot;, function () { importFile.click(); });
      if (importFile) importFile.addEventListener(&quot;change&quot;, function () { importRecord(importFile.files &amp;&amp; importFile.files[0]); importFile.value = &quot;&quot;; });
      var copyButton = root.querySelector(&quot;[data-copy-summary]&quot;);
      if (copyButton) copyButton.addEventListener(&quot;click&quot;, copySummary);
      var resetButton = root.querySelector(&quot;[data-reset]&quot;);
      if (resetButton) resetButton.addEventListener(&quot;click&quot;, function () {
        if (!window.confirm(&quot;确定清空这台浏览器里的全部练习记录吗？请先导出需要保留的内容。&quot;)) return;
        fields.forEach(function (field) { field.value = &quot;&quot;; });
        try { localStorage.removeItem(storageKey); } catch (error) { storageAvailable = false; }
        renderSummary();
        setStatus(&quot;本机练习记录已清空。 &quot;);
      });

      var links = Array.prototype.slice.call(root.querySelectorAll(&quot;a[href^=&#x27;#&#x27;]&quot;));
      links.forEach(function (link) {
        link.addEventListener(&quot;click&quot;, function (event) {
          var target = root.querySelector(link.getAttribute(&quot;href&quot;));
          if (!target) return;
          event.preventDefault();
          var reduced = window.matchMedia &amp;&amp; window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches;
          target.scrollIntoView({ behavior: reduced ? &quot;auto&quot; : &quot;smooth&quot;, block: &quot;start&quot; });
        });
      });
      var navLinks = Array.prototype.slice.call(root.querySelectorAll(&quot;[data-nav]&quot;));
      if (navLinks.length &amp;&amp; &quot;IntersectionObserver&quot; in window) {
        var map = {};
        navLinks.forEach(function (link) { map[link.getAttribute(&quot;href&quot;).slice(1)] = link; });
        var observer = new IntersectionObserver(function (entries) {
          var visible = entries.filter(function (entry) { return entry.isIntersecting; });
          if (!visible.length) return;
          visible.sort(function (a, b) { return Math.abs(a.boundingClientRect.top) - Math.abs(b.boundingClientRect.top); });
          navLinks.forEach(function (link) { link.removeAttribute(&quot;aria-current&quot;); });
          var active = map[visible[0].target.id];
          if (active) active.setAttribute(&quot;aria-current&quot;, &quot;location&quot;);
        }, { rootMargin: &quot;-8% 0px -76% 0px&quot;, threshold: [0, .01] });
        Array.prototype.slice.call(root.querySelectorAll(&quot;[data-practice-section]&quot;)).forEach(function (section) { observer.observe(section); });
      }
    }());
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
